<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2048 — Recréation</title>
<style>
  body { font-family: Arial, sans-serif; background: #faf8ef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { text-align: center; }
  h1 { color: #776e65; }
  #board { background: #bbada0; padding: 12px; border-radius: 6px; display: grid; grid-template-columns: repeat(4, 80px); grid-gap: 12px; }
  .cell { width: 80px; height: 80px; background: #cdc1b4; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
  .cell[data-val="2"]{background:#eee4da}
  .cell[data-val="4"]{background:#ede0c8}
  .cell[data-val="8"]{background:#f2b179;color:#fff}
  .cell[data-val="16"]{background:#f59563;color:#fff}
  .cell[data-val="32"]{background:#f67c5f;color:#fff}
  .cell[data-val="64"]{background:#f65e3b;color:#fff}
  .cell[data-val="128"]{background:#edcf72;color:#fff}
  .cell[data-val="256"]{background:#edcc61;color:#fff}
  .cell[data-val="512"]{background:#edc850;color:#fff}
  .cell[data-val="1024"]{background:#edc53f;color:#fff}
  .cell[data-val="2048"]{background:#edc22e;color:#fff}
  #score { margin: 12px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <h1>2048</h1>
    <div id="score">Score: 0</div>
    <div id="board"></div>
  </div>
<script>
  const SIZE = 4;
  let grid = [];
  let score = 0;

  const board = document.getElementById("board");
  const scoreEl = document.getElementById("score");

  function init(){
    grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    addNumber();
    addNumber();
    draw();
  }

  function addNumber(){
    let empty = [];
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0) empty.push({r,c});
      }
    }
    if(empty.length===0) return;
    let {r,c} = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random()<0.9?2:4;
  }

  function draw(){
    board.innerHTML = "";
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        let cell = document.createElement("div");
        cell.className = "cell";
        if(grid[r][c]!==0){
          cell.textContent = grid[r][c];
          cell.dataset.val = grid[r][c];
        }
        board.appendChild(cell);
      }
    }
    scoreEl.textContent = "Score: "+score;
  }

  function slide(row){
    row = row.filter(v=>v);
    for(let i=0;i<row.length-1;i++){
      if(row[i]===row[i+1]){
        row[i]*=2;
        score+=row[i];
        row[i+1]=0;
      }
    }
    row = row.filter(v=>v);
    while(row.length<SIZE) row.push(0);
    return row;
  }

  function rotate(){
    let newGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        newGrid[c][SIZE-1-r] = grid[r][c];
      }
    }
    grid = newGrid;
  }

  function moveLeft(){
    let moved = false;
    for(let r=0;r<SIZE;r++){
      let row = grid[r];
      let newRow = slide(row);
      if(newRow.toString()!==row.toString()) moved=true;
      grid[r] = newRow;
    }
    if(moved){ addNumber(); draw(); }
  }

  function moveRight(){
    for(let r=0;r<SIZE;r++) grid[r].reverse();
    moveLeft();
    for(let r=0;r<SIZE;r++) grid[r].reverse();
  }

  function moveUp(){
    rotate(); rotate(); rotate();
    moveLeft();
    rotate();
  }

  function moveDown(){
    rotate();
    moveLeft();
    rotate(); rotate(); rotate();
  }

  document.addEventListener("keydown", e => {
    if(e.key==="ArrowLeft") moveLeft();
    if(e.key==="ArrowRight") moveRight();
    if(e.key==="ArrowUp") moveUp();
    if(e.key==="ArrowDown") moveDown();
  });

  init();
</script>
</body>
</html>
